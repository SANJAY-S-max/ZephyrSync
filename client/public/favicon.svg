<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <!-- Glow gradient for arrows -->
    <linearGradient id="arrow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="arrow2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <!-- Node glow -->
    <radialGradient id="nodeGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Subtle grid lines in background -->
  <line x1="0" y1="50" x2="100" y2="50" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <line x1="50" y1="0" x2="50" y2="100" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.06"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>

  <!-- Left node (Laptop / Server) - hexagon shape -->
  <circle cx="22" cy="50" r="10" fill="url(#nodeGlow1)" opacity="0.4"/>
  <polygon points="22,39 30,44 30,56 22,61 14,56 14,44" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Server stacks inside left node -->
  <rect x="17" y="46" width="10" height="2.5" rx="0.8" fill="#60a5fa"/>
  <rect x="17" y="50" width="10" height="2.5" rx="0.8" fill="#93c5fd" opacity="0.7"/>
  <rect x="17" y="54" width="10" height="2.5" rx="0.8" fill="#60a5fa" opacity="0.5"/>

  <!-- Right node (Client Device) - hexagon shape -->
  <circle cx="78" cy="50" r="10" fill="url(#nodeGlow2)" opacity="0.4"/>
  <polygon points="78,39 86,44 86,56 78,61 70,56 70,44" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)"/>
  <!-- Device screen icon inside right node -->
  <rect x="73" y="45" width="10" height="8" rx="1" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="74.5" y1="53" x2="81.5" y2="53" stroke="#a78bfa" stroke-width="1"/>
  <line x1="77" y1="53" x2="79" y2="55" stroke="#a78bfa" stroke-width="0.8"/>

  <!-- Top data transfer arrow (left to right) -->
  <path d="M33 43 Q50 35 67 43" fill="none" stroke="url(#arrow1)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow head top -->
  <polygon points="67,43 62,40 63,45" fill="#06b6d4" filter="url(#glow)"/>
  <!-- Moving data packet on top arrow -->
  <circle cx="50" cy="37.5" r="2" fill="#7dd3fc" opacity="0.9" filter="url(#glow)"/>

  <!-- Bottom data transfer arrow (right to left) -->
  <path d="M67 57 Q50 65 33 57" fill="none" stroke="url(#arrow2)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow head bottom -->
  <polygon points="33,57 38,54 37,59" fill="#8b5cf6" filter="url(#glow)"/>
  <!-- Moving data packet on bottom arrow -->
  <circle cx="50" cy="62.5" r="2" fill="#c4b5fd" opacity="0.9" filter="url(#glow)"/>

  <!-- Center sync symbol (circular arrows) -->
  <circle cx="50" cy="50" r="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <!-- Sync arrows in center -->
  <path d="M46.5 47 A4 4 0 0 1 53.5 47" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="53.5,47 51,44.5 55.5,45" fill="#38bdf8"/>
  <path d="M53.5 53 A4 4 0 0 1 46.5 53" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="46.5,53 49,55.5 44.5,55" fill="#818cf8"/>
</svg>